name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Validate release version
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          node -e 'const fs=require("node:fs"); const manifest=JSON.parse(fs.readFileSync("manifest.json", "utf8")); const pkg=require("./package.json"); const expected=process.env.RELEASE_VERSION; if (!/^\d+\.\d+\.\d+$/.test(expected) || manifest.version !== expected || pkg.version !== expected) { throw new Error(`Tag ${expected}, manifest ${manifest.version}, and package ${pkg.version} must be matching semantic versions`); }'

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --draft --generate-notes --title "${{ github.ref_name }}" main.js manifest.json styles.css
